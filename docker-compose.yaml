services:
  master:
    build:
      context: .
      dockerfile: go-master/Dockerfile.master
    ports:
      - "${PORT:-50051}:${PORT:-50051}"
    volumes:
      # Mount the whole root so we can access any file relative to it
      - .:/app
    environment: # to pass to go binary
      - FILE=${FILE}
      - PORT=${PORT:-50051}
    command: master_bin

  worker-swarm:
    build:
      context: .
      dockerfile: python-worker/Dockerfile.worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:                           # workers wait for master to start
      - master
    environment:
      - MASTER_ADDR=${MASTER_ADDR:-master}
      - CORES=${CORES:-1}
